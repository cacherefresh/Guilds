[package]
name = "quest-service"
version = "0.1.0"
edition = "2021"
authors = ["Guild Developer"]
description = "Quest management microservice for Guild Quests application"

[dependencies]
# Web framework
actix-web = "4.3"
actix-cors = "0.6"

# Database
tokio-postgres = "0.7"
deadpool-postgres = "0.10"
postgres-types = { version = "0.2", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
dotenv = "0.15"
config = "0.13"
uuid = { version = "1.3", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
derive_more = "0.99"

# Async runtime
tokio = { version = "1.28", features = ["full"] }

# OpenAPI
utoipa = { version = "3.3", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "3.1", features = ["actix-web"] }

[dev-dependencies]
mockall = "0.11"
actix-rt = "2.8"
reqwest = { version = "0.11", features = ["json"] } 