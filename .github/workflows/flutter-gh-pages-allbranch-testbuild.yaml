# This is a basic workflow to help you get started with Actions

name: CI Deploy Flutter MonoRepo App with nested Flutter Packages - by Rob aka YuVi

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "sanctuary" branch
  push:
    branches: ["*"]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      # because it's a mono repo structure... r.c.
        working-directory: ./flutter_app

      - run: flutter build web --target lib/web_main.dart
        # because it's a mono repo structure... r.c.
        working-directory: ./flutter_app
        
