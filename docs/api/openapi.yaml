openapi: 3.0.3
info:
  title: Guild Application API
  description: API for Guild application to communicate between Flutter frontend and Rust backend
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.guildapp.example
    description: Production server

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    Character:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Default Character"
        guildName:
          type: string
          example: "Default Guild"
        interests:
          type: array
          items:
            type: string
          example: ["Music", "Programming", "Bringing AI to Life"]
        skills:
          type: array
          items:
            type: string
          example: ["Coding", "Design"]
        magicAbilities:
          type: array
          items:
            type: string
          example: ["Shadow Clone", "Shadow Minion"]
        position:
          type: object
          properties:
            x:
              type: number
              format: float
            y:
              type: number
              format: float
            z:
              type: number
              format: float
        currentAction:
          type: string
          enum: [idle, walking, thinking, pointing, sitting]
          example: "idle"
      required:
        - id
        - name

    Minion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        taskDescription:
          type: string
        category:
          type: string
        requestor:
          type: string
        assignee:
          type: string
        state:
          type: string
          enum: [loaded, start, doing, complete, canceled]
          default: loaded
        reward:
          type: number
          format: float
        isDone:
          type: boolean
      required:
        - id
        - taskDescription
        - category

    Quest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        category:
          type: string
        requestor:
          type: string
        assignee:
          type: string
          nullable: true
        reward:
          type: number
          format: float
        status:
          type: string
          enum: [available, assigned, completed]
          default: available
      required:
        - id
        - title
        - description
        - category
        - requestor
        - reward

    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      required:
        - code
        - message

paths:
  /characters:
    get:
      summary: List all characters
      security:
        - basicAuth: []
      responses:
        '200':
          description: A list of characters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Character'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new character
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Character'
      responses:
        '201':
          description: Character created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /characters/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a specific character
      security:
        - basicAuth: []
      responses:
        '200':
          description: Character details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '404':
          description: Character not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a character
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Character'
      responses:
        '200':
          description: Character updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Character not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /characters/{id}/location:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Update character location
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                x:
                  type: number
                  format: float
                y:
                  type: number
                  format: float
                z:
                  type: number
                  format: float
              required:
                - x
                - y
                - z
      responses:
        '200':
          description: Location updated
        '404':
          description: Character not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /minions:
    get:
      summary: List all minions
      security:
        - basicAuth: []
      parameters:
        - name: characterId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of minions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Minion'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new minion
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Minion'
      responses:
        '201':
          description: Minion created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Minion'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /minions/{id}/state:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Update minion state
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  enum: [loaded, start, doing, complete, canceled]
              required:
                - state
      responses:
        '200':
          description: State updated
        '400':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Minion not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /quests:
    get:
      summary: List all quests
      security:
        - basicAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [available, assigned, completed]
      responses:
        '200':
          description: A list of quests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Quest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new quest
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Quest'
      responses:
        '201':
          description: Quest created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quest'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /quests/{id}/assign:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Assign a quest
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignee:
                  type: string
              required:
                - assignee
      responses:
        '200':
          description: Quest assigned
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Quest not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /quests/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Complete a quest
      security:
        - basicAuth: []
      responses:
        '200':
          description: Quest completed
        '400':
          description: Invalid quest state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Quest not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error' 