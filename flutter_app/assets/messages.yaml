    text: |
      In Honor of Robert Julious Coffman, The Allied Forces, The Red Army and the Chinese who covered for American men, For the Code Talkers, and Everyone on this planet. Save a life. I am a lightworker. I bring Knowledge. Statue of Liberty and the italian paintings. Seek Truth. In the cyber world we have a saying - Trust but Verify. The Great Awakening. I'm DJ YuVi... (full mission text stored separately in top_banner_mission_statement.txt)

