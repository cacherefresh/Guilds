version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: guild_quests_postgres
    env_file:
      - ../SECRETS/api/database.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: liquibase/liquibase:4.20
    container_name: guild_quests_liquibase
    volumes:
      - ./liquibase:/liquibase/changelog
    command: --changeLogFile=changelog/master.xml --url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME} --username=${DB_USER} --password=${DB_PASSWORD} update
    env_file:
      - ../SECRETS/api/database.env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guild_quests_api
    env_file:
      - ../SECRETS/api/database.env
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    ports:
      - "8000:8000"
    depends_on:
      - liquibase

volumes:
  postgres_data:
  cargo_cache:
  target_cache: 