[package]
name = "api-gateway"
version = "0.1.0"
edition = "2021"
authors = ["Guild Developer"]
description = "API Gateway service for Guild Quests microservices architecture"

[dependencies]
# Web framework
actix-web = "4.3"
actix-cors = "0.6"
actix-web-httpauth = "0.8"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
dotenv = "0.15"
config = "0.13"
uuid = { version = "1.3", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
derive_more = "0.99"
async-trait = "0.1"

# Async runtime
tokio = { version = "1.28", features = ["full"] }

# OpenAPI
utoipa = { version = "3.3", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "3.1", features = ["actix-web"] }

# JWT Auth
jsonwebtoken = "8.3"

[dev-dependencies]
mockall = "0.11"
actix-rt = "2.8" 