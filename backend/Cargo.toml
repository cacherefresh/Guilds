[package]
name = "guild_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.3.1"
actix-cors = "0.6.4"
tokio = { version = "1.28.1", features = ["full"] }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
uuid = { version = "1.3.3", features = ["v4", "serde"] }
chrono = { version = "0.4.24", features = ["serde"] }
env_logger = "0.10.0"
log = "0.4.17"
dotenv = "0.15.0"
sqlx = { version = "0.6.3", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }
futures = "0.3.28"
thiserror = "1.0.40"
anyhow = "1.0.71"
argon2 = "0.5.0"
jsonwebtoken = "8.3.0"
actix-web-httpauth = "0.8.0" 