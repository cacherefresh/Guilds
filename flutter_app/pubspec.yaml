name: guild_app
description: A Flutter application for Guilds with a 3D character and room.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  provider: ^6.0.5
  http: ^1.6.0
  shared_preferences: ^2.1.0
  flutter_gl: ^0.0.21
  vector_math: ^2.1.4
  model_viewer_plus: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/textures/
    - assets/images/
    - assets/animations/
    - assets/top_banner_mission_statement.txt
    - assets/messages.yaml
    - assets/data_quests/
